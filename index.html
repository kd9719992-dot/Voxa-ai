<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxa AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #02060d;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .status-text {
      position: absolute;
      bottom: 18%;
      color: rgba(0, 243, 255, 0.7);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s ease;
      text-align: center;
    }

    .voxa-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
      cursor: pointer;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .outer-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.3);
      will-change: transform, box-shadow;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    .sphere-boundary {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 243, 255, 0.85);
      box-shadow: 0 0 12px #00f3ff, inset 0 0 14px #00f3ff;
      filter: drop-shadow(0 0 8px #00f3ff);
      will-change: transform;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .wave-1 {
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 40% 45% 43% 47%;
      border: 1.8px solid rgba(0, 243, 255, 0.75);
      box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.5);
      will-change: transform;
      transition: border-color 0.5s ease;
    }

    .wave-2 {
      position: absolute;
      width: 127px;
      height: 127px;
      border-radius: 46% 42% 44% 40%;
      border: 1.5px solid rgba(0, 200, 255, 0.65);
      filter: blur(0.6px);
      will-change: transform;
      transition: border-color 0.5s ease;
    }

    .inner-core {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(0, 243, 255, 0.35), rgba(2, 6, 13, 0.95) 75%);
      box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3);
      will-change: transform;
      transition: background 0.5s ease;
    }

    /* Thinking State Override */
    .thinking .outer-glow {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), inset 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .thinking .sphere-boundary {
      border-color: rgba(168, 85, 247, 0.9);
      box-shadow: 0 0 15px #a855f7, inset 0 0 14px #a855f7;
      filter: drop-shadow(0 0 10px #a855f7);
    }
    .thinking .wave-1, .thinking .wave-2 {
      border-color: rgba(192, 132, 252, 0.8);
    }
    .thinking .inner-core {
      background: radial-gradient(circle at 35% 35%, rgba(168, 85, 247, 0.4), rgba(2, 6, 13, 0.95) 75%);
    }
  </style>
</head>
<body>

  <div class="voxa-container" id="voxaOrb">
    <div class="outer-glow" id="glow"></div>
    <div class="inner-core" id="core"></div>
    <div class="wave-1" id="w1"></div>
    <div class="wave-2" id="w2"></div>
    <div class="sphere-boundary" id="boundary"></div>
  </div>

<div class="status-text" id="statusText">Starting...</div>
  

  <script>
    // Your proxy URL (Cloudflare Worker). No API key lives in this file.
    const PROXY_URL = "https://voxa-proxy.termuxoffical999.workers.dev";

    const $ = (id) => document.getElementById(id);
    const voxaOrb = $('voxaOrb'), glow = $('glow'), core = $('core'),
          boundary = $('boundary'), w1 = $('w1'), w2 = $('w2'), statusText = $('statusText');

    // ---------- State ----------
    // boot | needs-tap | listening | thinking | speaking
    let state = 'boot';
    let audioCtx = null, analyser = null, stream = null, timeData = null, initPromise = null;
    let currentSegment = null, segmentStartedAt = 0;
    let noiseFloor = 0.01, aboveSince = 0, lastVoiceAt = 0, speechStartedAt = 0;
    let isUserSpeaking = false, voiceVolume = 0;

    const SILENCE_MS = 700, MIN_SPEECH_MS = 350, ONSET_MS = 150, IDLE_RECYCLE_MS = 4000, MAX_UTTERANCE_MS = 30000;

    const recorderOptions = (() => {
      if (typeof MediaRecorder === 'undefined') return {};
      for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']) {
        if (MediaRecorder.isTypeSupported(t)) return { mimeType: t };
      }
      return {};
    })();

    const voxaBrainMemory = [{
      role: "system",
      content: "Aap Voxa hain, ek smart voice assistant. Short, clear Hinglish me answer dein."
    }];

    const setStatus = (t) => { statusText.innerText = t; };
    const setThinking = (on) => voxaOrb.classList.toggle('thinking', on);

    // ---------- Mic + AudioContext lifecycle ----------
    async function ensureRunning() {
      if (!audioCtx) return false;
      if (audioCtx.state !== 'running') {
        // resume() can hang forever without a user gesture, so never await it unguarded
        await Promise.race([
          audioCtx.resume().catch(() => {}),
          new Promise(r => setTimeout(r, 500))
        ]);
      }
      return audioCtx.state === 'running';
    }

    function teardown() {
      stopSegment(true);
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
      stream = audioCtx = analyser = null;
      initPromise = null;
      state = 'boot';
    }

    function initAudio() {
      if (initPromise) return initPromise;       // prevents duplicate mic/context creation
      initPromise = (async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
            video: false
          });
          stream.getAudioTracks().forEach(t => t.addEventListener('ended', () => {
            teardown();
            setStatus('Mic disconnected - tap to retry');
          }));

          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();                    // default rate: avoids sample-rate mismatch errors
          audioCtx.addEventListener('statechange', onCtxStateChange);

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          audioCtx.createMediaStreamSource(stream).connect(analyser);
          timeData = new Uint8Array(analyser.fftSize);

          if (await ensureRunning()) enterListening();
          else { state = 'needs-tap'; setStatus('Tap to start'); }
        } catch (err) {
          console.error('Mic init error:', err);
          const denied = err && err.name === 'NotAllowedError';
          teardown();
          setStatus(denied ? 'Mic Permission Denied - tap to retry' : 'Mic Error - tap to retry');
        }
      })();
      return initPromise;
    }

    function onCtxStateChange() {
      if (!audioCtx) return;
      if (audioCtx.state === 'running' && state === 'needs-tap') enterListening();
      else if (audioCtx.state !== 'running' && state === 'listening') {
        ensureRunning().then(ok => {
          if (!ok && state === 'listening') { stopSegment(true); state = 'needs-tap'; setStatus('Tap to start'); }
        });
      }
    }

    let gestureBusy = false;
    async function onUserGesture() {
      if (gestureBusy) return;
      gestureBusy = true;
      try {
        if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {}); // inside the gesture
        if (!initPromise) await initAudio();
        if (await ensureRunning() && state === 'needs-tap') enterListening();
      } finally { gestureBusy = false; }
    }
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev =>
      document.addEventListener(ev, onUserGesture, { passive: true }));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audioCtx) ensureRunning().then(ok => { if (ok && state === 'needs-tap') enterListening(); });
    });

    // ---------- Recording (fresh recorder per segment) ----------
    function startSegment() {
      stopSegment(true);
      if (!stream || typeof MediaRecorder === 'undefined') return;
      const chunks = [];
      let rec;
      try { rec = new MediaRecorder(stream, recorderOptions); } catch (e) { rec = new MediaRecorder(stream); }
      const seg = { rec, discard: false };
      rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => {
        if (seg.discard || !chunks.length) return;
        handleUtterance(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
      };
      rec.start();
      currentSegment = seg;
      segmentStartedAt = performance.now();
    }

    function stopSegment(discard) {
      const seg = currentSegment;
      currentSegment = null;
      if (!seg) return;
      seg.discard = discard;
      if (seg.rec.state !== 'inactive') { try { seg.rec.stop(); } catch (e) {} }
    }

    function enterListening() {
      state = 'listening';
      isUserSpeaking = false; aboveSince = 0;
      setThinking(false);
      setStatus('Listening...');
      startSegment();
    }

    function backToListening() {
      setThinking(false);
      if (!audioCtx || audioCtx.state !== 'running') { state = 'needs-tap'; setStatus('Tap to start'); return; }
      enterListening();
    }

    // ---------- Voice activity detection (runs on a timer, not rAF) ----------
    function detect() {
      if (!analyser || !audioCtx || audioCtx.state !== 'running') { voiceVolume = 0; return; }
      analyser.getByteTimeDomainData(timeData);
      let sum = 0;
      for (let i = 0; i < timeData.length; i++) { const v = (timeData[i] - 128) / 128; sum += v * v; }
      const level = Math.sqrt(sum / timeData.length);

      if (state !== 'listening') { voiceVolume = 0; return; }

      const now = performance.now();
      const threshold = Math.max(0.025, noiseFloor * 2.5 + 0.01);       // adapts to room noise
      const loud = level > (isUserSpeaking ? threshold * 0.7 : threshold);
      if (!loud && !isUserSpeaking) noiseFloor = noiseFloor * 0.97 + level * 0.03;

      voiceVolume = loud ? Math.max(0.2, Math.min(0.4 + (level - threshold) / 0.04, 2)) : 0;

      if (loud) {
        lastVoiceAt = now;
        if (!aboveSince) aboveSince = now;
        if (!isUserSpeaking && now - aboveSince >= ONSET_MS) { isUserSpeaking = true; speechStartedAt = aboveSince; }
        if (isUserSpeaking && now - speechStartedAt > MAX_UTTERANCE_MS) finishUtterance();
      } else {
        aboveSince = 0;
        if (isUserSpeaking && now - lastVoiceAt >= SILENCE_MS) finishUtterance();
        else if (!isUserSpeaking && now - segmentStartedAt > IDLE_RECYCLE_MS) startSegment(); // drop old silence
      }
    }
    setInterval(detect, 40);

    function finishUtterance() {
      const speechMs = lastVoiceAt - speechStartedAt;
      isUserSpeaking = false; aboveSince = 0;
      if (speechMs < MIN_SPEECH_MS) { startSegment(); return; }   // click / cough / noise blip
      state = 'thinking';                                          // set immediately: no race window
      setThinking(true);
      setStatus('Voxa Thinking...');
      stopSegment(false);                                          // onstop -> handleUtterance
    }

    // ---------- Groq pipeline ----------
    class UserError extends Error {}

    async function readJson(res) {
      const t = await res.text();
      try { return JSON.parse(t); }
      catch (e) { throw new UserError('Server ' + res.status + ': ' + t.slice(0, 40)); }
    }

    async function handleUtterance(blob) {
      if (state !== 'thinking') return;
      try {
        if (blob.size < 2000) return backToListening();
        const text = await transcribe(blob);
        if (!text) return backToListening();
        const reply = await askVoxaBrain(text);
        speakResponse(reply);
      } catch (err) {
        console.error(err);
        setStatus(err instanceof UserError ? err.message : (err instanceof TypeError ? 'Network Error: request blocked (CORS/URL)' : 'Error: ' + err.message));
        setTimeout(backToListening, 1500);
      }
    }

    async function transcribe(blob) {
      const ext = (blob.type || '').includes('mp4') ? 'm4a' : 'webm';
      const fd = new FormData();
      fd.append("file", blob, `audio.${ext}`);
      fd.append("model", "whisper-large-v3-turbo");
      const res = await fetch(PROXY_URL + "/transcribe", {
        method: "POST", body: fd
      });
      const data = await readJson(res);
      if (data.error) throw new UserError("Server Error: " + String((data.error && data.error.message) || data.error).slice(0, 60));
      return (data.text || '').trim();
    }

    async function askVoxaBrain(userPrompt) {
      voxaBrainMemory.push({ role: "user", content: userPrompt });
      if (voxaBrainMemory.length > 21) voxaBrainMemory.splice(1, voxaBrainMemory.length - 21);
      try {
        const res = await fetch(PROXY_URL + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: voxaBrainMemory, max_tokens: 120 })
        });
        const data = await readJson(res);
        const reply = data.choices && data.choices[0] && data.choices[0].message.content;
        if (!reply) throw new UserError("Brain Error");
        voxaBrainMemory.push({ role: "assistant", content: reply });
        return reply;
      } catch (e) {
        voxaBrainMemory.pop();                       // keep user/assistant turns alternating
        throw e;
      }
    }

    // ---------- Speech ----------
    function speakResponse(text) {
      const synth = window.speechSynthesis;
      if (!synth) return backToListening();

      state = 'speaking';
      setThinking(false);
      setStatus('Voxa Speaking...');

      let done = false, watchdog;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(watchdog);
        try { synth.cancel(); } catch (e) {}
        setTimeout(backToListening, 350);            // let speaker tail die so mic doesn't hear it
      };

      try {
        synth.cancel();
        try { synth.resume(); } catch (e) {}
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "hi-IN";
        const voices = synth.getVoices() || [];
        const v = voices.find(x => x.lang && x.lang.startsWith('hi')) || voices.find(x => x.lang === 'en-IN');
        if (v) u.voice = v;
        u.onend = finish;
        u.onerror = finish;
        watchdog = setTimeout(finish, Math.max(5000, text.length * 150 + 3000)); // onend sometimes never fires
        synth.speak(u);
      } catch (e) { finish(); }
    }

    // ---------- Orb animation ----------
    let main360Rot = 0, rot1 = 0, rot2 = 0, basePulse = 0;
    let currentSpeed = 0.6, currentScale = 1.0, currentGlow = 25, coreGlowScale = 1.0;
    const lerp = (a, b, t) => (1 - t) * a + t * b;

    function render() {
      const thinking = state === 'thinking';
      const vv = state === 'speaking' ? 1.6 : voiceVolume;
      let targetSpeed = 0.6, targetScale = 1.0, targetGlow = 25, targetCore = 1.0;

      if (thinking) { targetSpeed = 1.8; targetGlow = 45; targetCore = 1.15; }
      else if (vv > 0) {
        targetSpeed = 0.6 + vv * 2.8;
        targetScale = 1.0 + vv * 0.12;
        targetGlow = 25 + vv * 35;
        targetCore = 1.0 + vv * 0.18;
      }

      const ease = (vv > 0 || thinking) ? 0.08 : 0.18;
      currentSpeed = lerp(currentSpeed, targetSpeed, ease);
      currentScale = lerp(currentScale, targetScale, ease);
      currentGlow = lerp(currentGlow, targetGlow, ease);
      coreGlowScale = lerp(coreGlowScale, targetCore, ease);

      main360Rot = (main360Rot + currentSpeed * 0.7) % 360;
      rot1 = (rot1 + currentSpeed * 1.2) % 360;
      rot2 = (rot2 - currentSpeed * 0.9) % 360;
      basePulse += 0.025;
      const finalScale = currentScale + Math.sin(basePulse) * 0.02;

      voxaOrb.style.transform = `rotate(${main360Rot}deg)`;
      w1.style.transform = `rotate(${rot1}deg) scale(${finalScale})`;
      w2.style.transform = `rotate(${rot2}deg) scale(${finalScale * 1.02})`;
      boundary.style.transform = `scale(${finalScale})`;
      core.style.transform = `scale(${coreGlowScale})`;
      glow.style.boxShadow = `0 0 ${currentGlow}px ${thinking ? 'rgba(168, 85, 247, 0.85)' : 'rgba(0, 243, 255, 0.85)'}`;
      requestAnimationFrame(render);
    }

    render();
    initAudio();
  </script>
</body>
</html>
