<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxa AI</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--c:0,243,255}
body{background:#02060d;height:100vh;width:100vw;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;font-family:Arial,sans-serif;transition:background .8s}
body.admin-on{--c:125,211,252;background:radial-gradient(circle at 50% 45%,#07324d,#02060d 72%)}
.status-text{position:absolute;bottom:18%;color:rgba(var(--c),.7);font-size:14px;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:0 16px}
.voxa-container{position:relative;width:150px;height:150px;display:flex;justify-content:center;align-items:center;will-change:transform;cursor:pointer;user-select:none;-webkit-user-select:none}
.voxa-container.thinking{--c:168,85,247}
.voxa-container>div{position:absolute;border-radius:50%;will-change:transform;transition:background .5s,box-shadow .5s,border-color .5s}
.outer-glow{width:100%;height:100%;background:radial-gradient(circle,rgba(var(--c),.25) 0,rgba(0,0,0,0) 70%);box-shadow:0 0 25px rgba(var(--c),.4),inset 0 0 15px rgba(var(--c),.3)}
.sphere-boundary{width:130px;height:130px;border:1.5px solid rgba(var(--c),.85);box-shadow:0 0 12px rgb(var(--c)),inset 0 0 14px rgb(var(--c));filter:drop-shadow(0 0 8px rgb(var(--c)))}
.wave-1{width:125px;height:125px;border-radius:40% 45% 43% 47%;border:1.8px solid rgba(var(--c),.75);box-shadow:inset 0 0 8px rgba(var(--c),.5)}
.wave-2{width:127px;height:127px;border-radius:46% 42% 44% 40%;border:1.5px solid rgba(var(--c),.65);filter:blur(.6px)}
.inner-core{width:120px;height:120px;background:radial-gradient(circle at 35% 35%,rgba(var(--c),.35),rgba(2,6,13,.95) 75%);box-shadow:inset 0 0 15px rgba(var(--c),.3)}
.admin-on .voxa-container::before,.admin-on .voxa-container::after{content:"";position:absolute;border-radius:50%;border:2px dashed rgba(var(--c),.8)}
.admin-on .voxa-container::before{inset:-26px;animation:sp 12s linear infinite}
.admin-on .voxa-container::after{inset:-14px;border-style:dotted;animation:sp 7s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="voxa-container" id="voxaOrb">
<div class="outer-glow" id="glow"></div>
<div class="inner-core" id="core"></div>
<div class="wave-1" id="w1"></div>
<div class="wave-2" id="w2"></div>
<div class="sphere-boundary" id="boundary"></div>
</div>
<div class="status-text" id="statusText">Starting...</div>
<script>
const PROXY_URL = "https://voxa-proxy.termuxoffical999.workers.dev";
const $ = (id) => document.getElementById(id);
const voxaOrb = $('voxaOrb'), glow = $('glow'), core = $('core'),
boundary = $('boundary'), w1 = $('w1'), w2 = $('w2'), statusText = $('statusText');
let state = 'boot';
let audioCtx = null, analyser = null, stream = null, timeData = null, initPromise = null;
let currentSegment = null, segmentStartedAt = 0;
let noiseFloor = 0.01, aboveSince = 0, lastVoiceAt = 0, speechStartedAt = 0;
let isUserSpeaking = false, voiceVolume = 0;
let adminOn = false, adminToken = '', adminStep = 0, adminTries = 0;
const SILENCE_MS = 700, MIN_SPEECH_MS = 350, ONSET_MS = 150, IDLE_RECYCLE_MS = 4000, MAX_UTTERANCE_MS = 30000;
const VOICE_PITCH = 1.35, VOICE_RATE = 1.05, NEURAL_TTS = true;
const recorderOptions = (() => {
if (typeof MediaRecorder === 'undefined') return {};
for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']) {
if (MediaRecorder.isTypeSupported(t)) return { mimeType: t };
}
return {};
})();
const voxaBrainMemory = [{
role: "system",
content: "."
}];
const setStatus = (t) => { statusText.innerText = t; };
const setThinking = (on) => voxaOrb.classList.toggle('thinking', on);
async function ensureRunning() {
if (!audioCtx) return false;
if (audioCtx.state !== 'running') {
await Promise.race([
audioCtx.resume().catch(() => {}),
new Promise(r => setTimeout(r, 500))
]);
}
return audioCtx.state === 'running';
}
function teardown() {
stopSegment(true);
if (stream) stream.getTracks().forEach(t => t.stop());
if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
stream = audioCtx = analyser = null;
initPromise = null;
state = 'boot';
}
function initAudio() {
if (initPromise) return initPromise;
initPromise = (async () => {
try {
stream = await navigator.mediaDevices.getUserMedia({
audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
video: false
});
stream.getAudioTracks().forEach(t => t.addEventListener('ended', () => {
teardown();
setStatus('Mic disconnected - tap to retry');
}));
const AC = window.AudioContext || window.webkitAudioContext;
audioCtx = new AC();
audioCtx.addEventListener('statechange', onCtxStateChange);
analyser = audioCtx.createAnalyser();
analyser.fftSize = 1024;
audioCtx.createMediaStreamSource(stream).connect(analyser);
timeData = new Uint8Array(analyser.fftSize);
if (await ensureRunning()) enterListening();
else { state = 'needs-tap'; setStatus('Tap to start'); }
} catch (err) {
console.error('Mic init error:', err);
const denied = err && err.name === 'NotAllowedError';
teardown();
setStatus(denied ? 'Mic Permission Denied - tap to retry' : 'Mic Error - tap to retry');
}
})();
return initPromise;
}
function onCtxStateChange() {
if (!audioCtx) return;
if (audioCtx.state === 'running' && state === 'needs-tap') enterListening();
else if (audioCtx.state !== 'running' && state === 'listening') {
ensureRunning().then(ok => {
if (!ok && state === 'listening') { stopSegment(true); state = 'needs-tap'; setStatus('Tap to start'); }
});
}
}
let gestureBusy = false;
async function onUserGesture() {
if (gestureBusy) return;
gestureBusy = true;
try {
if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
if (!initPromise) await initAudio();
if (await ensureRunning() && state === 'needs-tap') enterListening();
} finally { gestureBusy = false; }
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev =>
document.addEventListener(ev, onUserGesture, { passive: true }));
function startSegment() {
stopSegment(true);
if (!stream || typeof MediaRecorder === 'undefined') return;
const chunks = [];
let rec;
try { rec = new MediaRecorder(stream, recorderOptions); } catch (e) { rec = new MediaRecorder(stream); }
const seg = { rec, discard: false };
rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
rec.onstop = () => {
if (seg.discard || !chunks.length) return;
handleUtterance(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
};
rec.start();
currentSegment = seg;
segmentStartedAt = performance.now();
}
function stopSegment(discard) {
const seg = currentSegment;
currentSegment = null;
if (!seg) return;
seg.discard = discard;
if (seg.rec.state !== 'inactive') { try { seg.rec.stop(); } catch (e) {} }
}
function enterListening() {
state = 'listening';
isUserSpeaking = false; aboveSince = 0;
setThinking(false);
setStatus('Listening...');
startSegment();
}
function backToListening() {
setThinking(false);
if (!audioCtx || audioCtx.state !== 'running') { state = 'needs-tap'; setStatus('Tap to start'); return; }
enterListening();
}
function detect() {
if (!analyser || !audioCtx || audioCtx.state !== 'running') { voiceVolume = 0; return; }
analyser.getByteTimeDomainData(timeData);
let sum = 0;
for (let i = 0; i < timeData.length; i++) { const v = (timeData[i] - 128) / 128; sum += v * v; }
const level = Math.sqrt(sum / timeData.length);
if (state !== 'listening') { voiceVolume = 0; return; }
const now = performance.now();
const threshold = Math.max(0.025, noiseFloor * 2.5 + 0.01);
const loud = level > (isUserSpeaking ? threshold * 0.7 : threshold);
if (!loud && !isUserSpeaking) noiseFloor = noiseFloor * 0.97 + level * 0.03;
voiceVolume = loud ? Math.max(0.2, Math.min(0.4 + (level - threshold) / 0.04, 2)) : 0;
if (loud) {
lastVoiceAt = now;
if (!aboveSince) aboveSince = now;
if (!isUserSpeaking && now - aboveSince >= ONSET_MS) { isUserSpeaking = true; speechStartedAt = aboveSince; }
if (isUserSpeaking && now - speechStartedAt > MAX_UTTERANCE_MS) finishUtterance();
} else {
aboveSince = 0;
if (isUserSpeaking && now - lastVoiceAt >= SILENCE_MS) finishUtterance();
else if (!isUserSpeaking && now - segmentStartedAt > IDLE_RECYCLE_MS) startSegment();
}
}
setInterval(detect, 40);
function finishUtterance() {
const speechMs = lastVoiceAt - speechStartedAt;
isUserSpeaking = false; aboveSince = 0;
if (speechMs < MIN_SPEECH_MS) { startSegment(); return; }
state = 'thinking';
setThinking(true);
setStatus('Voxa Thinking...');
stopSegment(false);
}
class UserError extends Error {}
async function readJson(res) {
const t = await res.text();
try { return JSON.parse(t); }
catch (e) { throw new UserError('Server ' + res.status + ': ' + t.slice(0, 40)); }
}
async function handleUtterance(blob) {
if (state !== 'thinking') return;
try {
if (blob.size < 2000) return backToListening();
const text = await transcribe(blob);
if (!text) return backToListening();
await handleCommand(text);
} catch (err) {
console.error(err);
setStatus(err instanceof UserError ? err.message : (err instanceof TypeError ? 'Network Error: request blocked (CORS/URL)' : 'Error: ' + err.message));
setTimeout(backToListening, 1500);
}
}
function setAdmin(on) {
adminOn = on;
if (!on) adminToken = '';
document.body.classList.toggle('admin-on', on);
}
function sayLine(t) { startSpeech(); enqueueSpeech(t); endSpeechStream(); }
function adminIntent(t) {
if (!/admin|एडमिन|एडमीन|अडमिन|ऐडमिन/i.test(t) || !/mode|मोड/i.test(t)) return '';
return /\b(off|disable|deactivate|exit|close)\b|ऑफ|बंद|बन्द/i.test(t) ? 'off' : 'on';
}
async function checkPassword(text) {
const r = await fetch(PROXY_URL + "/admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pass: text }) });
const d = await r.json().catch(() => ({}));
if (d.token) { adminStep = 0; adminToken = d.token; setAdmin(true); return sayLine('[excited] Admin mode activated. All systems at full power.'); }
if (++adminTries >= 3) { adminStep = 0; return sayLine('[serious] Too many wrong attempts. Admin mode cancelled.'); }
sayLine('[serious] Wrong password. Please try again.');
}
async function handleCommand(text) {
if (adminStep === 1) return checkPassword(text);
const it = adminIntent(text);
if (it === 'off') { setAdmin(false); adminStep = 0; return sayLine('[calm] Admin mode off.'); }
if (it === 'on') {
if (adminOn) return sayLine('[calm] Admin mode is already active.');
adminStep = 1; adminTries = 0;
return sayLine('[serious] Admin mode requested. Please say the password.');
}
return streamReply(text);
}
async function transcribe(blob) {
const ext = (blob.type || '').includes('mp4') ? 'm4a' : 'webm';
const fd = new FormData();
fd.append("file", blob, `audio.${ext}`);
fd.append("model", "whisper-large-v3");
fd.append("temperature", "0");
if (adminStep === 1) fd.append("language", "en");
fd.append("prompt", "यह हिंदी और English मिली हुई बातचीत है। मेरे phone की battery जल्दी खत्म हो जाती है, आज का weather कैसा है? Hello, how are you today?");
const res = await fetch(PROXY_URL + "/transcribe", {
method: "POST", body: fd, signal: AbortSignal.timeout(20000)
});
const data = await readJson(res);
if (data.error) throw new UserError("Server Error: " + String((data.error && data.error.message) || data.error).slice(0, 60));
return (data.text || '').trim();
}
async function streamReply(userPrompt) {
voxaBrainMemory.push({ role: "user", content: userPrompt });
if (voxaBrainMemory.length > 7) voxaBrainMemory.splice(1, voxaBrainMemory.length - 7);
const synth = window.speechSynthesis;
let full = '', buf = '', started = false;
const emit = (sentence) => {
if (!synth) return;
if (!started) { started = true; startSpeech(); }
enqueueSpeech(sentence);
};
try {
const res = await fetch(PROXY_URL + "/chat", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ messages: voxaBrainMemory, stream: true, admin: adminToken }), signal: AbortSignal.timeout(25000)
});
if (!res.ok || !res.body) {
const t = await res.text().catch(() => '');
throw new UserError('Server ' + res.status + ': ' + t.slice(0, 40));
}
const reader = res.body.getReader();
const dec = new TextDecoder();
let sse = '', raw = '', fin = '', sawR = false;
while (true) {
const { value, done } = await reader.read();
if (done) break;
const chunk = dec.decode(value, { stream: true }); raw += chunk; sse += chunk;
let nl;
while ((nl = sse.indexOf('\n')) >= 0) {
const line = sse.slice(0, nl).trim();
sse = sse.slice(nl + 1);
if (!line.startsWith('data:')) continue;
const payload = line.slice(5).trim();
if (payload === '[DONE]') continue;
let j; try { j = JSON.parse(payload); } catch (e) { continue; }
const c0 = j.choices && j.choices[0];
if (c0) { if (c0.finish_reason) fin = c0.finish_reason; if (c0.delta && c0.delta.reasoning) sawR = true; }
if (j.error) throw new UserError('Brain: ' + String(j.error.message || j.error).slice(0, 50));
const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
if (d) {
full += d; buf += d;
let m;
while ((m = buf.match(/^([\s\S]*?[.!?।])\s+/))) { emit(m[1]); buf = buf.slice(m[0].length); }
}
}
}
if (buf.trim()) emit(buf);
if (!full.trim()) throw new UserError('Brain Error: empty (' + (fin || 'no finish') + (sawR ? ', thinking only' : '') + ', ' + raw.length + 'B)');
voxaBrainMemory.push({ role: "assistant", content: full });
if (started) endSpeechStream(); else backToListening();
} catch (e) {
if (started) {
if (full.trim()) voxaBrainMemory.push({ role: "assistant", content: full });
endSpeechStream();
return;
}
voxaBrainMemory.pop();
throw e;
}
}
function cleanForSpeech(t) {
return String(t).replace(/\[[^\]]*\]/g, ' ').replace(/[*_#`~|]/g, ' ').replace(/\p{Extended_Pictographic}/gu, '').replace(/\s+/g, ' ').trim();
}
let speech = null, playChain = Promise.resolve();
function startSpeech() {
const synth = window.speechSynthesis;
try { if (synth && (synth.speaking || synth.pending)) synth.cancel(); } catch (e) {}
playChain = Promise.resolve();
speech = { pending: 0, streamEnded: false, done: false, chars: 0, watchdog: null, started: false, src: null, emo: 'cheerful', first: false, rest: '', restEmo: '' };
}
function markStarted(sp) {
if (sp.started || sp.done) return;
sp.started = true;
if (speech === sp) { state = 'speaking'; setThinking(false); setStatus('Voxa Speaking...' + (sp.note ? ' ⚠ ' + sp.note : '')); }
}
function armWatchdog(sp) {
clearTimeout(sp.watchdog);
sp.watchdog = setTimeout(() => finishSpeech(sp), 15000 + sp.chars * 200);
}
function finishSpeech(sp) {
if (!sp || sp.done) return;
sp.done = true;
clearTimeout(sp.watchdog);
try { if (sp.src) sp.src.stop(); } catch (e) {}
try { window.speechSynthesis.cancel(); } catch (e) {}
setTimeout(backToListening, 350);
}
function checkSpeechDone(sp) { if (sp.streamEnded && sp.pending <= 0) finishSpeech(sp); }
function flushRest(sp) {
if (!sp.rest) return;
queueSpeech(sp, sp.rest, sp.restEmo || sp.emo);
sp.rest = ''; sp.restEmo = '';
}
function endSpeechStream() {
if (!speech) return;
flushRest(speech);
speech.streamEnded = true;
checkSpeechDone(speech);
}
function speakPart(sp, p, cb) {
const synth = window.speechSynthesis;
p = p.replace(/<[^>]*>/g, ' ').trim();
if (!synth || !p) return cb();
const u = new SpeechSynthesisUtterance(p);
if (/[\u0900-\u097F]/.test(p)) u.lang = 'hi-IN';
u.pitch = VOICE_PITCH; u.rate = VOICE_RATE;
u.onstart = () => markStarted(sp);
u.onend = u.onerror = () => cb();
try { synth.speak(u); } catch (err) { cb(); }
}
async function fetchAudio(text, emo) {
const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 9000);
try {
const r = await fetch(PROXY_URL + "/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, emo, admin: adminToken }), signal: ctl.signal });
if (!r.ok) throw new Error((await r.text()).slice(0, 90));
const buf = await audioCtx.decodeAudioData(await r.arrayBuffer());
const d = buf.getChannelData(0);
let pk = 0;
for (let i = 0; i < d.length; i += 10) pk = Math.max(pk, Math.abs(d[i]));
if (pk < 0.004) throw new Error('silent audio');
return buf;
} finally { clearTimeout(t); }
}
async function playBuffer(sp, buf) {
if (audioCtx.state !== 'running') await ensureRunning();
if (audioCtx.state !== 'running') throw new Error('audio locked');
return new Promise(res => {
const src = audioCtx.createBufferSource();
const g = audioCtx.createGain();
g.gain.value = adminOn ? 1.6 : 1;
src.buffer = buf; src.connect(g); g.connect(audioCtx.destination); src.onended = res;
sp.src = src; src.start(); markStarted(sp);
setTimeout(res, buf.duration * 1000 + 2000);
});
}
function queueSpeech(sp, p, emo) {
sp.pending++;
const job = NEURAL_TTS ? fetchAudio(p, emo) : Promise.reject(new Error('off'));
job.catch(() => {});
playChain = playChain.then(async () => {
if (sp.done) return;
try { await playBuffer(sp, await job); }
catch (e) {
console.warn('Neural voice failed, using phone voice:', e.message);
sp.note = String(e.message).slice(0, 80);
if (sp.started) setStatus('Voxa Speaking... ⚠ ' + sp.note);
if (!sp.done) await Promise.race([new Promise(r => speakPart(sp, p, r)), new Promise(r => setTimeout(r, 6000 + p.length * 150))]);
}
}).finally(() => { sp.pending--; checkSpeechDone(sp); });
}
function enqueueSpeech(text) {
const sp = speech;
if (!sp || sp.done) return;
const em = text.match(/^\s*\[([^\]]{2,20})\]/);
if (em) sp.emo = em[1].toLowerCase().trim();
const clean = cleanForSpeech(text);
if (!clean) return;
(clean.match(/[^.!?।]+[.!?।]*/g) || [clean]).map(p => p.trim()).filter(p => /[\p{L}\p{N}]/u.test(p)).forEach(p => {
sp.chars += p.length;
if (sp.first && /[\u0900-\u097F]/.test(p)) { sp.rest = (sp.rest ? sp.rest + ' ' : '') + p; sp.restEmo = sp.restEmo || sp.emo; }
else { flushRest(sp); sp.first = true; queueSpeech(sp, p, sp.emo); }
});
armWatchdog(sp);
}
let main360Rot = 0, rot1 = 0, rot2 = 0, basePulse = 0;
let currentSpeed = 0.6, currentScale = 1.0, currentGlow = 25, coreGlowScale = 1.0;
const lerp = (a, b, t) => (1 - t) * a + t * b;
function render() {
const thinking = state === 'thinking';
const vv = state === 'speaking' ? 1.6 : voiceVolume;
let targetSpeed = 0.6, targetScale = 1.0, targetGlow = 25, targetCore = 1.0;
if (thinking) { targetSpeed = 1.8; targetGlow = 45; targetCore = 1.15; }
else if (vv > 0) {
targetSpeed = 0.6 + vv * 2.8;
targetScale = 1.0 + vv * 0.12;
targetGlow = 25 + vv * 35;
targetCore = 1.0 + vv * 0.18;
}
const ease = (vv > 0 || thinking) ? 0.08 : 0.18;
currentSpeed = lerp(currentSpeed, targetSpeed, ease);
currentScale = lerp(currentScale, targetScale, ease);
currentGlow = lerp(currentGlow, targetGlow, ease);
coreGlowScale = lerp(coreGlowScale, targetCore, ease);
main360Rot = (main360Rot + currentSpeed * 0.7) % 360;
rot1 = (rot1 + currentSpeed * 1.2) % 360;
rot2 = (rot2 - currentSpeed * 0.9) % 360;
basePulse += 0.025;
const finalScale = currentScale + Math.sin(basePulse) * 0.02;
voxaOrb.style.transform = `rotate(${main360Rot}deg)`;
w1.style.transform = `rotate(${rot1}deg) scale(${finalScale})`;
w2.style.transform = `rotate(${rot2}deg) scale(${finalScale * 1.02})`;
boundary.style.transform = `scale(${finalScale})`;
core.style.transform = `scale(${coreGlowScale})`;
glow.style.boxShadow = `0 0 ${currentGlow * (adminOn ? 1.6 : 1)}px rgba(var(--c),.85)`;
requestAnimationFrame(render);
}
render();
initAudio();
</script>
