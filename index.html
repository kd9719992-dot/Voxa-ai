<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxa AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #02060d;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .status-text {
      position: absolute;
      bottom: 18%;
      color: rgba(0, 243, 255, 0.7);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s ease;
      text-align: center;
    }

    .voxa-container {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
      cursor: pointer;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .outer-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.3);
      will-change: transform, box-shadow;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    .sphere-boundary {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 243, 255, 0.85);
      box-shadow: 0 0 12px #00f3ff, inset 0 0 14px #00f3ff;
      filter: drop-shadow(0 0 8px #00f3ff);
      will-change: transform;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .wave-1 {
      position: absolute;
      width: 125px;
      height: 125px;
      border-radius: 40% 45% 43% 47%;
      border: 1.8px solid rgba(0, 243, 255, 0.75);
      box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.5);
      will-change: transform;
      transition: border-color 0.5s ease;
    }

    .wave-2 {
      position: absolute;
      width: 127px;
      height: 127px;
      border-radius: 46% 42% 44% 40%;
      border: 1.5px solid rgba(0, 200, 255, 0.65);
      filter: blur(0.6px);
      will-change: transform;
      transition: border-color 0.5s ease;
    }

    .inner-core {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(0, 243, 255, 0.35), rgba(2, 6, 13, 0.95) 75%);
      box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3);
      will-change: transform;
      transition: background 0.5s ease;
    }

    /* Thinking State Override */
    .thinking .outer-glow {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.6), inset 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .thinking .sphere-boundary {
      border-color: rgba(168, 85, 247, 0.9);
      box-shadow: 0 0 15px #a855f7, inset 0 0 14px #a855f7;
      filter: drop-shadow(0 0 10px #a855f7);
    }
    .thinking .wave-1, .thinking .wave-2 {
      border-color: rgba(192, 132, 252, 0.8);
    }
    .thinking .inner-core {
      background: radial-gradient(circle at 35% 35%, rgba(168, 85, 247, 0.4), rgba(2, 6, 13, 0.95) 75%);
    }
  </style>
</head>
<body>

  <div class="voxa-container" id="voxaOrb">
    <div class="outer-glow" id="glow"></div>
    <div class="inner-core" id="core"></div>
    <div class="wave-1" id="w1"></div>
    <div class="wave-2" id="w2"></div>
    <div class="sphere-boundary" id="boundary"></div>
  </div>

<div class="status-text" id="statusText">Listening...</div>
  

  <script>
    // ⚠️ Apni Nayi Groq API Key Quotes Ke Andar Dalein:
    const GROQ_API_KEY = "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";

    const voxaOrb = document.getElementById('voxaOrb');
    const glow = document.getElementById('glow');
    const core = document.getElementById('core');
    const boundary = document.getElementById('boundary');
    const w1 = document.getElementById('w1');
    const w2 = document.getElementById('w2');
    const statusText = document.getElementById('statusText');

    let main360Rot = 0, rot1 = 0, rot2 = 0, basePulse = 0;
    let audioCtx, analyser, dataArray;
    let mediaRecorder, audioChunks = [];
    let isListening = false, isAiSpeaking = false, isThinking = false, isUserSpeaking = false;
    let silenceTimer = null;

    let currentSpeed = 0.6, currentScale = 1.0, currentGlow     = 25, coreGlowScale = 1.0;

    const voxaBrainMemory = [
      {
        role: "system",
        content: "Aap Voxa hain, ek smart voice assistant. Short, clear Hinglish me answer dein."
      }
    ];

    async function initPermanentMic() {
      if (isListening) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
          video: false 
        });
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          try { await audioCtx.resume(); } catch(e) {}
        }
        
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.4;
        
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isListening = true;

        statusText.innerText = "Listening...";
        setupMediaRecorder(stream);
      } catch (err) {
        statusText.innerText = "Mic Permission Denied";
        console.error("Mic Access Error:", err);
      }
    }

    function setupMediaRecorder(stream) {
  let options = {};
  if (MediaRecorder.isTypeSupported('audio/webm')) {
    options = { mimeType: 'audio/webm' };
  } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
    options = { mimeType: 'audio/mp4' };
  }

  try {
    mediaRecorder = new MediaRecorder(stream, options);
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream);
  }

  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) audioChunks.push(e.data);
  };

  mediaRecorder.onstop = async () => {
    if (audioChunks.length > 0 && !isAiSpeaking) {
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/wav' });
      audioChunks = [];
      await transcribeAudio(blob);
    }
  };

  mediaRecorder.start();
}


    function processVoiceSilence(avg) {
  if (isAiSpeaking || isThinking) return;

  if (avg > 6) {
    if (!isUserSpeaking) {
      isUserSpeaking = true;
      statusText.innerText = "Listening...";
      if (mediaRecorder && mediaRecorder.state === "inactive") {
        mediaRecorder.start();
      }
    }
    clearTimeout(silenceTimer);
  } else if (isUserSpeaking) {
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      isUserSpeaking = false;
      statusText.innerText = "Voxa Thinking...";
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    }, 1000);
  }
}


    async function transcribeAudio(blob) {
      setThinkingState(true);

      const formData = new FormData();
      formData.append("file", blob, "audio.wav");
      formData.append("model", "whisper-large-v3-turbo");

      try {
        const res = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
          body: formData
        });

        const data = await res.json();

        if (data.error) {
  statusText.innerText = "Groq API Key Error";
  setThinkingState(false);
  setTimeout(() => { restartRecording(); }, 1500);
  return;
        }
        

        if (data.text && data.text.trim().length > 0) {
          await askVoxaBrain(data.text);
        } else {
          setThinkingState(false);
          restartRecording();
        }
      } catch (err) {
        statusText.innerText = "Network Error";
        setThinkingState(false);
        restartRecording();
      }
    }

    async function askVoxaBrain(userPrompt) {
      statusText.innerText = "Voxa Thinking...";
      voxaBrainMemory.push({ role: "user", content: userPrompt });

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: voxaBrainMemory,
            max_tokens: 120
          })
        });

        const data = await response.json();

        if (data.choices && data.choices[0]) {
          const reply = data.choices[0].message.content;
          voxaBrainMemory.push({ role: "assistant", content: reply });
          setThinkingState(false);
          speakResponse(reply);
        } else {
          statusText.innerText = "Brain Error";
          setThinkingState(false);
          restartRecording();
        }
      } catch (err) {
        statusText.innerText = "API Error";
        setThinkingState(false);
        restartRecording();
      }
    }

    function setThinkingState(state) {
      isThinking = state;
      if (state) {
        voxaOrb.classList.add('thinking');
      } else {
        voxaOrb.classList.remove('thinking');
      }
    }

    // SAFE SPEECH SYNTHESIS FIX FOR APP WEBVIEW
    function speakResponse(text) {
      if (!('speechSynthesis' in window) || !window.speechSynthesis) {
        restartRecording();
        return;
      }

      try {
        window.speechSynthesis.cancel();

        // Safe Resume (App Crash Handler)
        if (typeof window.speechSynthesis.resume === 'function') {
          try { window.speechSynthesis.resume(); } catch (e) {}
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "hi-IN";
        utterance.rate = 1.0;

        let voices = window.speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
          let selectedVoice = voices.find(v => v.lang && (v.lang.includes('hi') || v.lang.includes('IN')));
          if (selectedVoice) utterance.voice = selectedVoice;
        }

        utterance.onstart = () => { 
          isAiSpeaking = true; 
          statusText.innerText = "Voxa Speaking...";
        };
        
        utterance.onend = () => { 
          isAiSpeaking = false; 
          restartRecording();
        };

        utterance.onerror = () => {
          isAiSpeaking = false;
          restartRecording();
        };

        window.speechSynthesis.speak(utterance);
      } catch (e) {
        isAiSpeaking = false;
        restartRecording();
      }
    }

    function restartRecording() {
      statusText.innerText = "Listening...";
      if (mediaRecorder && mediaRecorder.state === "inactive") {
        mediaRecorder.start();
      }
    }

    function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

    function render() {
      let targetSpeed = 0.6, targetScale = 1.0, targetGlow = 25, targetCoreScale = 1.0;
      let isVoiceActive = false;

      if (isThinking) {
        targetSpeed = 1.8;
        targetGlow = 45;
        targetCoreScale = 1.15;
      } else if (isListening && analyser) {
        analyser.getByteFrequencyData(dataArray);
        let sum = dataArray.reduce((a, b) => a + b, 0);
        let avg = sum / dataArray.length;
        
        processVoiceSilence(avg);

        if (avg > 8 || isAiSpeaking) { 
          isVoiceActive = true;
          let voiceVolume = isAiSpeaking ? 1.6 : Math.min((avg - 8) / 18, 2.0); 
          targetSpeed = 0.6 + (voiceVolume * 2.8); 
          targetScale = 1.0 + (voiceVolume * 0.12);
          targetGlow = 25 + (voiceVolume * 35);
          targetCoreScale = 1.0 + (voiceVolume * 0.18);
        }
      }

      let easingFactor = isVoiceActive || isThinking ? 0.08 : 0.18;
      currentSpeed = lerp(currentSpeed, targetSpeed, easingFactor);
      currentScale = lerp(currentScale, targetScale, easingFactor);
      currentGlow = lerp(currentGlow, targetGlow, easingFactor);
      coreGlowScale = lerp(coreGlowScale, targetCoreScale, easingFactor);

      main360Rot = (main360Rot + currentSpeed * 0.7) % 360;
      rot1 = (rot1 + currentSpeed * 1.2) % 360;
      rot2 = (rot2 - currentSpeed * 0.9) % 360;

      basePulse += 0.025;
      let finalScale = currentScale + Math.sin(basePulse) * 0.02;

      voxaOrb.style.transform = `rotate(${main360Rot}deg)`;
      w1.style.transform = `rotate(${rot1}deg) scale(${finalScale})`;
      w2.style.transform = `rotate(${rot2}deg) scale(${finalScale * 1.02})`;
      boundary.style.transform = `scale(${finalScale})`;
      core.style.transform = `scale(${coreGlowScale})`;

      glow.style.boxShadow = `0 0 ${currentGlow}px ${isThinking ? 'rgba(168, 85, 247, 0.85)' : 'rgba(0, 243, 255, 0.85)'}`;

      requestAnimationFrame(render);
    }

    // SAFE CLICK HANDLER FOR APP CONTAINER
    window.addEventListener('DOMContentLoaded', () => {
  initPermanentMic();
});

document.addEventListener('click', async () => {
  await initPermanentMic();
  if (audioCtx && audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch(e) {}
  }
});
    
    render();
  </script>
</body>
</html>
