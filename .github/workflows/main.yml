
name: Build Voxa AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/voxa/ai
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoxaAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.voxa.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.voxa.ai'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>

              <uses-feature
                  android:name="android.hardware.microphone"
                  android:required="false"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Voxa AI"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/voxa/ai/MainActivity.java <<'EOF'
          package com.voxa.ai;

          import android.app.Activity;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.view.ActionMode;
          import android.view.MotionEvent;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {

              private WebView webView;
              private PermissionRequest pendingRequest;

              private static final int MIC_PERMISSION_CODE = 101;

              private static final String WEBSITE =
                  "https://kd9719992-dot.github.io/Voxa-ai/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);
                  settings.setAllowFileAccess(false);

                  // Block long-press on WebView
                  webView.setLongClickable(false);
                  webView.setHapticFeedbackEnabled(false);
                  webView.setOnLongClickListener(v -> true);

                  // Block text selection menu
                  webView.setCustomSelectionActionModeCallback(
                      new ActionMode.Callback() {
                          @Override
                          public boolean onCreateActionMode(
                              ActionMode mode, android.view.Menu menu) {
                              return false;
                          }

                          @Override
                          public boolean onPrepareActionMode(
                              ActionMode mode, android.view.Menu menu) {
                              return false;
                          }

                          @Override
                          public boolean onActionItemClicked(
                              ActionMode mode, android.view.MenuItem item) {
                              return false;
                          }

                          @Override
                          public void onDestroyActionMode(ActionMode mode) {
                          }
                      }
                  );

                  webView.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          v.cancelLongPress();
                      }
                      return false;
                  });

                  // Web page load and text-selection prevention
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          String js =
                              "(function() {" +
                              "if(document.getElementById('voxaNoSelectStyle')) return;" +
                              "var s=document.createElement('style');" +
                              "s.id='voxaNoSelectStyle';" +
                              "s.innerHTML=" +
                              "'*{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;}' +" +
                              "'input,textarea,[contenteditable=true],[contenteditable=true] *,'[role=textbox]'{" +
                              "-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important;}' +" +
                              "'body{-webkit-tap-highlight-color:transparent;}' ;" +
                              "document.head.appendChild(s);" +
                              "})();";

                          view.evaluateJavascript(js, null);
                      }
                  });

                  // Microphone permission handling
                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> handleMicPermission(request));
                      }
                  });

                  webView.loadUrl(WEBSITE);
              }

              private void handleMicPermission(PermissionRequest request) {

                  boolean audioRequested = false;

                  for (String resource : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                          audioRequested = true;
                      }
                  }

                  if (!audioRequested) {
                      request.deny();
                      return;
                  }

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          == PackageManager.PERMISSION_GRANTED) {

                      request.grant(new String[]{
                          PermissionRequest.RESOURCE_AUDIO_CAPTURE
                      });

                  } else {
                      pendingRequest = request;

                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          MIC_PERMISSION_CODE
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults) {

                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults);

                  if (requestCode == MIC_PERMISSION_CODE
                          && pendingRequest != null) {

                      if (grantResults.length > 0
                              && grantResults[0]
                              == PackageManager.PERMISSION_GRANTED) {

                          pendingRequest.grant(new String[]{
                              PermissionRequest.RESOURCE_AUDIO_CAPTURE
                          });

                      } else {
                          pendingRequest.deny();
                      }

                      pendingRequest = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxa-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
